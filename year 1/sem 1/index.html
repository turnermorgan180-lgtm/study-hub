<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester 1 — Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1d2026;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0ede8;
    --muted: #7a7d85;
    --accent: #c9a84c;
    --accent2: #e8c97a;
    --micro: #5b8fa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(91,143,168,0.05) 0%, transparent 60%);
    pointer-events: none;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
    position: relative;
    z-index: 1;
  }
  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    box-shadow: 0 10px 20px rgba(0,0,0,0.18);
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    margin-bottom: 1.5rem;
  }
  .back-btn:hover {
    transform: translateY(-1px);
    background: var(--surface2);
    border-color: rgba(255,255,255,0.18);
  }
  .eyebrow, .tag, .meta {
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .eyebrow {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 2rem;
  }
  .tag {
    font-size: 10px;
    color: #7fb8d4;
    margin-bottom: 0.45rem;
  }
  .module-title {
    font-size: 1.05rem;
    margin-bottom: 0.35rem;
  }
  .module-copy {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 0.8rem;
  }
  .meta {
    font-size: 11px;
    color: var(--accent2);
  }
  .footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 0.5px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .container { padding: 2rem 1.25rem 4rem; }
  }

.page-transition-init{opacity:0;transform:translateY(8px)}
.page-transition-ready{opacity:1;transform:none}
.page-transition-leaving{opacity:0;transform:translateY(6px);pointer-events:none}
body{transition:opacity .22s ease,transform .22s ease}
@media (prefers-reduced-motion: reduce){body,.page-transition-init,.page-transition-ready,.page-transition-leaving{transition:none!important;transform:none!important}}
</style>
</head>
<body>
<div class="container">
  <a class="back-btn" href="../index.html" aria-label="Back to Year 1 page">←</a>

  <div class="eyebrow">Study Hub · Year 1</div>
  <h1>Semester 1</h1>
  <div class="subtitle"></div>

  <div class="footer">Semester 1 navigation hub</div>
</div>
<script>
(function(){
  document.body.classList.add("page-transition-init");
  window.addEventListener("load", function(){
    requestAnimationFrame(function(){
      document.body.classList.remove("page-transition-init");
      document.body.classList.add("page-transition-ready");
    });
  });
  document.addEventListener("click", function(event){
    var link = event.target.closest("a[href]");
    if (!link) return;
    if (event.defaultPrevented || event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    if (link.target && link.target !== "_self") return;
    if (link.hasAttribute("download")) return;
    var href = link.getAttribute("href");
    if (!href || href.charAt(0) === "#") return;
    if (/^(mailto:|tel:|javascript:)/i.test(href)) return;
    var url = new URL(link.href, window.location.href);
    if (url.origin !== window.location.origin) return;
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
    event.preventDefault();
    document.body.classList.remove("page-transition-ready");
    document.body.classList.add("page-transition-leaving");
    window.setTimeout(function(){ window.location.href = url.href; }, 180);
  });
})();
</script>

d:b.end};}function cleanTex(tex){return String(tex).replace(/&nbsp;/g,' ').replace(/&pound;/g,'GBP').replace(/&sigma;/g,'σ').replace(/&rho;/g,'ρ').replace(/&beta;/g,'β').replace(/&radic;/g,'√').replace(/>=/g,bs+'ge ').replace(/<=/g,bs+'le ').replace(/\bapprox\b/gi,bs+'approx ').replace(/\bapproximately\b/gi,bs+'approx ').replace(/\bunion\b/gi,bs+'cup ').replace(/\bx\b/g,bs+'times ').replace(/−/g,'-');}function convertTex(raw){var tex=cleanTex(raw),out='',i=0;while(i<tex.length){if(tex.slice(i,i+5)===bs+'frac'){var r=commandWithTwoGroups(tex,i,bs+'frac',function(a,b){return '<span class="math-frac"><span class="top">'+convertTex(a)+'</span><span class="bottom">'+convertTex(b)+'</span></span>';});out+=r.html;i=r.end;continue;}if(tex.slice(i,i+6)===bs+'binom'){var br=commandWithTwoGroups(tex,i,bs+'binom',function(a,b){return '<span class="math-binom"><span>'+convertTex(a)+'</span><span>'+convertTex(b)+'</span></span>';});out+=br.html;i=br.end;continue;}if(tex.slice(i,i+5)===bs+'sqrt'){var g=readGroup(tex,i+5);out+='<span class="math-sqrt">√<span class="math-radicand">'+convertTex(g.value)+'</span></span>';i=g.end;continue;}if(tex.slice(i,i+5)===bs+'text'){var tg=readGroup(tex,i+5);out+='<span class="math-text">'+esc(tg.value)+'</span>';i=tg.end;continue;}if(tex.slice(i,i+4)===bs+'bar'){var bg=readGroup(tex,i+4);out+='<span style="text-decoration:overline">'+convertTex(bg.value)+'</span>';i=bg.end;continue;}if(tex.slice(i,i+4)===bs+'hat'){var hg=readGroup(tex,i+4);out+='<span>'+convertTex(hg.value)+'̂</span>';i=hg.end;continue;}if(tex.slice(i,i+4)===bs+'sum'){out+='<span class="math-sum">Σ</span>';i+=4;continue;}if(tex[i]==='_'||tex[i]==='^'){var tag=tex[i]==='_'?'sub':'sup';var sg=readGroup(tex,i+1);out+='<'+tag+'>'+convertTex(sg.value)+'</'+tag+'>';i=sg.end;continue;}var rest=tex.slice(i),map={};map[bs+'left']='';map[bs+'right']='';map[bs+'times']='×';map[bs+'cdots']='⋯';map[bs+'pm']='±';map[bs+'cup']='∪';map[bs+'cap']='∩';map[bs+'mid']='|';map[bs+'approx']='≈';map[bs+'ge']='≥';map[bs+'le']='≤';map[bs+'Rightarrow']='⇒';map[bs+'quad']='  ';map[bs+',']=' ';map[bs+'%']='%';map[bs+'chi']='χ';map[bs+'sigma']='σ';map[bs+'rho']='ρ';map[bs+'beta']='β';map[bs+'mu']='μ';map[bs+'alpha']='α';map[bs+'ln']='ln';map[bs+'operatorname']='';map[bs+'max']='max';var matched=false,keys=Object.keys(map).sort(function(a,b){return b.length-a.length;});for(var k=0;k<keys.length;k++){var key=keys[k];if(rest.indexOf(key)===0){out+=map[key];i+=key.length;matched=true;break;}}if(matched)continue;if(tex[i]===bs){i++;continue;}out+=esc(tex[i]);i++;}return out;}function makeNode(kind,tex){var span=document.createElement('span');span.className=kind==='display'?'math-display':'math-inline';span.setAttribute('data-tex',tex);span.innerHTML=convertTex(tex);return span;}function excluded(node){var p=node.parentNode;if(!p)return true;if(p.closest&&p.closest('.math-inline,.math-display,script,noscript,style,textarea,pre,code'))return true;return false;}function replaceMarkers(root){var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(node){if(excluded(node))return NodeFilter.FILTER_REJECT;return node.nodeValue.indexOf('[[math:')!==-1||node.nodeValue.indexOf('[[display:')!==-1?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}}),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(function(node){var text=node.nodeValue,frag=document.createDocumentFragment(),re=/\[\[(math|display):([\s\S]*?)\]\]/g,last=0,m;while((m=re.exec(text))){if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));frag.appendChild(makeNode(m[1],m[2]));last=re.lastIndex;}if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node);});}function renderPlainFormulas(root){var formulaRe=/(?:\b[0-9][0-9,]*(?:\.[0-9]+)?(?=\s*=)|\b(?:P\([^)]{1,70}\)|E\(R[^)]*\)|Var\([^)]*\)|Cov\([^)]*\)|FV|PV|NPV|IRR|WACC|EAR|APR|HPR|CAPM|Beta|beta|Mean|Variance|SD|SE|CI|Expected return|Required return|Future value|Present value|Price|Conversion value|Conversion price|Conversion premium|Unemployment rate|Labour force|Terms of trade index|MR|MC|AR|AC|P\/E|k|r|g|t|N|C|P0|D1|EPS1))[^.;?!\n<>]{0,150}(?:=|≈|>=|<=|≤|≥|±|×|\+|\/|\^|\bapprox\b|\bapproximately\b|\babout\b)[^.;?!\n<>]{0,120}/g;var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(node){if(excluded(node))return NodeFilter.FILTER_REJECT;var p=node.parentNode;if(p&&p.classList&&p.classList.contains('formula')&&node.nodeValue.trim())return NodeFilter.FILTER_ACCEPT;return formulaRe.test(node.nodeValue)?(formulaRe.lastIndex=0,NodeFilter.FILTER_ACCEPT):NodeFilter.FILTER_REJECT;}}),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(function(node){var text=node.nodeValue,frag=document.createDocumentFragment(),last=0,m;if(node.parentNode&&node.parentNode.classList&&node.parentNode.classList.contains('formula')){node.parentNode.replaceChild(makeNode('display',text.trim()),node);return;}formulaRe.lastIndex=0;while((m=formulaRe.exec(text))){var expr=m[0].replace(/[,:\s]+$/,'');var trim=m[0].slice(expr.length);if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));frag.appendChild(makeNode('math',expr));if(trim)frag.appendChild(document.createTextNode(trim));last=m.index+m[0].length;}if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));if(frag.childNodes.length)node.parentNode.replaceChild(frag,node);});}function renderMathIn(root){if(!root)return;replaceMarkers(root);renderPlainFormulas(root);}window.studyHubTypesetMath=renderMathIn;function boot(){renderMathIn(document.body);var obs=new MutationObserver(function(records){records.forEach(function(r){r.addedNodes.forEach(function(n){if(n.nodeType===1)renderMathIn(n);else if(n.nodeType===3&&n.parentNode)renderMathIn(n.parentNode);});});});obs.observe(document.body,{childList:true,subtree:true});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script><script id="study-hub-navigation-fix">
(function(){
  if (window.__studyHubNavigationFix) return;
  window.__studyHubNavigationFix = true;
  var MAP_KEY = 'studyHubBackMap';
  function sameOrigin(url){try{return new URL(url, window.location.href).origin === window.location.origin;}catch(e){return false;}}
  function clean(url){var u = new URL(url, window.location.href); u.hash = ''; return u.href;}
  function currentClean(){return clean(window.location.href);}
  function readMap(){try{return JSON.parse(sessionStorage.getItem(MAP_KEY) || '{}') || {};}catch(e){return {};}}
  function writeMap(map){try{sessionStorage.setItem(MAP_KEY, JSON.stringify(map));}catch(e){}}
  function resetTransition(){
    document.body.classList.remove('page-transition-init','page-transition-leaving');
    document.body.classList.add('page-transition-ready');
  }
  function go(url){
    if (!url) return;
    document.body.classList.remove('page-transition-init','page-transition-ready');
    document.body.classList.add('page-transition-leaving');
    window.setTimeout(function(){ window.location.href = url; }, 80);
  }
  function meaningfulHere(link){
    var here = new URL(window.location.href);
    var card = link && link.closest && link.closest('.question-card[id], .exam-q[id]');
    if (card && (link.classList.contains('topic-link') || /lecture|formula|summary|flashcard|topic/i.test(link.textContent || ''))) here.hash = card.id;
    return here.href;
  }
  function remember(link){
    if (!link || link.classList.contains('back-btn')) return;
    if (link.target && link.target !== '_self') return;
    if (link.hasAttribute('download')) return;
    var href = link.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    if (/^(mailto:|tel:|javascript:)/i.test(href)) return;
    var dest;
    try { dest = new URL(link.href, window.location.href); } catch(e) { return; }
    if (dest.origin !== window.location.origin) return;
    var here = meaningfulHere(link);
    var map = readMap();
    map[clean(dest.href)] = here;
    writeMap(map);
  }
  function storedReturn(){
    var map = readMap();
    var mapped = map[currentClean()];
    if (mapped && sameOrigin(mapped) && clean(mapped) !== currentClean()) return mapped;
    return null;
  }
  function isEditable(el){return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/i.test(el.tagName));}
  function handleBack(fallbackHref){
    var target = storedReturn();
    if (target) { go(target); return; }
    if (document.referrer && sameOrigin(document.referrer) && history.length > 1) {
      var before = window.location.href;
      history.back();
      window.setTimeout(function(){ if (window.location.href === before && fallbackHref) go(fallbackHref); }, 350);
      return;
    }
    if (fallbackHref) go(fallbackHref);
  }
  window.addEventListener('pageshow', resetTransition);
  window.addEventListener('popstate', resetTransition);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) resetTransition(); });
  document.addEventListener('click', function(event){
    var link = event.target.closest && event.target.closest('a[href]');
    if (!link) return;
    if (link.classList.contains('back-btn')) {
      if (event.defaultPrevented || event.button !== 0) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      handleBack(link.href);
      return;
    }
    remember(link);
  }, true);
  document.addEventListener('keydown', function(event){
    if (event.key !== 'Backspace') return;
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    if (isEditable(document.activeElement)) return;
    var fallback = document.querySelector('a.back-btn[href]');
    if (!fallback) return;
    event.preventDefault();
    handleBack(fallback.href);
  });
  resetTransition();
})();
</script>
</body>
</html>
