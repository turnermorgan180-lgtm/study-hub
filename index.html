<style id="study-hub-math-style">.math-inline,.math-display{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink,#2c2416);font-weight:600;letter-spacing:0}.math-inline{display:inline-flex;align-items:center;gap:.12em;vertical-align:middle;line-height:1.25}.math-display{display:flex;align-items:center;justify-content:center;gap:.16em;line-height:1.35;font-size:1.22rem;white-space:normal;overflow-x:auto;padding:.1rem 0}.formula .math-display{justify-content:flex-start}.math-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;line-height:1.05}.math-frac>.top{border-bottom:1px solid currentColor;padding:0 .24em .08em}.math-frac>.bottom{padding:.08em .24em 0}.math-binom{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;line-height:1.0}.math-binom::before{content:'(';position:absolute}.math-sqrt{display:inline-flex;align-items:flex-start}.math-radicand{border-top:1px solid currentColor;padding:0 .18em}.math-sum{display:inline-flex;align-items:center;font-size:1.28em;margin:0 .06em}.math-text{font-family:'DM Sans',sans-serif;font-size:.88em;font-weight:500}.math-display sub,.math-display sup,.math-inline sub,.math-inline sup{font-size:.68em;line-height:0}</style><script id="study-hub-math-renderer">(function(){if(window.__studyHubMathRenderer)return;window.__studyHubMathRenderer=true;var bs=String.fromCharCode(92);function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function readGroup(s,i){while(s[i]===' ')i++;if(s[i]!=='{')return {value:s[i]||'',end:i+1};var depth=0,start=i+1;for(var j=i;j<s.length;j++){if(s[j]==='{')depth++;else if(s[j]==='}'){depth--;if(depth===0)return {value:s.slice(start,j),end:j+1};}}return {value:s.slice(start),end:s.length};}function commandWithTwoGroups(s,i,cmd,fn){var a=readGroup(s,i+cmd.length);var b=readGroup(s,a.end);return {html:fn(a.value,b.value),end:b.end};}function convertTex(tex){var out='',i=0;while(i<tex.length){if(tex.slice(i,i+5)===bs+'frac'){var r=commandWithTwoGroups(tex,i,bs+'frac',function(a,b){return '<span class="math-frac"><span class="top">'+convertTex(a)+'</span><span class="bottom">'+convertTex(b)+'</span></span>';});out+=r.html;i=r.end;continue;}if(tex.slice(i,i+6)===bs+'binom'){var br=commandWithTwoGroups(tex,i,bs+'binom',function(a,b){return '<span class="math-binom"><span>'+convertTex(a)+'</span><span>'+convertTex(b)+'</span></span>';});out+=br.html;i=br.end;continue;}if(tex.slice(i,i+5)===bs+'sqrt'){var g=readGroup(tex,i+5);out+='<span class="math-sqrt">√<span class="math-radicand">'+convertTex(g.value)+'</span></span>';i=g.end;continue;}if(tex.slice(i,i+5)===bs+'text'){var tg=readGroup(tex,i+5);out+='<span class="math-text">'+esc(tg.value)+'</span>';i=tg.end;continue;}if(tex.slice(i,i+4)===bs+'bar'){var bg=readGroup(tex,i+4);out+='<span style="text-decoration:overline">'+convertTex(bg.value)+'</span>';i=bg.end;continue;}if(tex.slice(i,i+4)===bs+'hat'){var hg=readGroup(tex,i+4);out+='<span>'+convertTex(hg.value)+'̂</span>';i=hg.end;continue;}if(tex.slice(i,i+4)===bs+'sum'){out+='<span class="math-sum">Σ</span>';i+=4;continue;}if(tex[i]==='_'||tex[i]==='^'){var tag=tex[i]==='_'?'sub':'sup';var sg=readGroup(tex,i+1);out+='<'+tag+'>'+convertTex(sg.value)+'</'+tag+'>';i=sg.end;continue;}var rest=tex.slice(i);var map={};map[bs+'left']='';map[bs+'right']='';map[bs+'times']='×';map[bs+'cdots']='⋯';map[bs+'pm']='±';map[bs+'cup']='∪';map[bs+'cap']='∩';map[bs+'mid']='|';map[bs+'approx']='≈';map[bs+'ge']='≥';map[bs+'le']='≤';map[bs+'Rightarrow']='⇒';map[bs+'quad']='  ';map[bs+',']=' ';map[bs+'%']='%';map[bs+'chi']='χ';map[bs+'sigma']='σ';map[bs+'rho']='ρ';map[bs+'beta']='β';map[bs+'mu']='μ';map[bs+'alpha']='α';map[bs+'ln']='ln';map[bs+'operatorname']='';map[bs+'max']='max';var matched=false;var keys=Object.keys(map).sort(function(a,b){return b.length-a.length;});for(var k=0;k<keys.length;k++){var key=keys[k];if(rest.indexOf(key)===0){out+=map[key];i+=key.length;matched=true;break;}}if(matched)continue;if(tex[i]===bs){i++;continue;}out+=esc(tex[i]);i++;}return out;}function makeNode(kind,tex){var span=document.createElement('span');span.className=kind==='display'?'math-display':'math-inline';span.setAttribute('data-tex',tex);span.innerHTML=convertTex(tex);return span;}function renderMathIn(root){if(!root)return;var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(node){var p=node.parentNode;if(!p)return NodeFilter.FILTER_REJECT;var tag=p.nodeName.toLowerCase();if(['script','noscript','style','textarea','pre','code'].indexOf(tag)!==-1)return NodeFilter.FILTER_REJECT;return node.nodeValue.indexOf('[[math:')!==-1||node.nodeValue.indexOf('[[display:')!==-1?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(function(node){var text=node.nodeValue,frag=document.createDocumentFragment(),re=/\[\[(math|display):([\s\S]*?)\]\]/g,last=0,m;while((m=re.exec(text))){if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));frag.appendChild(makeNode(m[1],m[2]));last=re.lastIndex;}if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node);});}window.studyHubTypesetMath=renderMathIn;function boot(){renderMathIn(document.body);var obs=new MutationObserver(function(records){records.forEach(function(r){r.addedNodes.forEach(function(n){if(n.nodeType===1)renderMathIn(n);else if(n.nodeType===3&&n.parentNode)renderMathIn(n.parentNode);});});});obs.observe(document.body,{childList:true,subtree:true});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script></body>
